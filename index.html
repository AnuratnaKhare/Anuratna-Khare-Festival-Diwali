<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali from Anuratna Khare</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #1a0033 0%, #050014 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 10;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }

        .sender-name {
            font-size: 1.5rem;
            color: #ff8c00;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.8rem;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin-bottom: 30px;
        }

        /* Diya Virtual Tap Area */
        .diya-section {
            margin-top: 10px;
            cursor: pointer;
            position: relative;
        }

        .tap-instruction {
            font-size: 1.2rem;
            color: #ffcc00;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
            font-weight: 500;
        }

        .diya-container {
            width: 160px;
            height: 160px;
            margin: 0 auto;
            position: relative;
            transition: transform 0.2s;
        }

        .diya-container:active {
            transform: scale(0.95);
        }

        .diya-bowl {
            width: 130px;
            height: 65px;
            background: linear-gradient(to bottom, #d2691e, #8b4513);
            border-bottom-left-radius: 65px;
            border-bottom-right-radius: 65px;
            position: absolute;
            bottom: 20px;
            left: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        .diya-bowl::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 130px;
            height: 15px;
            background: #b22222;
            border-radius: 50%;
        }

        .flame {
            width: 34px;
            height: 50px;
            background: linear-gradient(to bottom, #ff4500, #ffd700, #ffffff);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            position: absolute;
            bottom: 80px;
            left: 63px;
            transform-origin: center bottom;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .lit .flame {
            opacity: 1;
            animation: flicker 0.1s ease-in-out infinite alternate;
            box-shadow: 0 0 25px #ff8c00, 0 0 50px #ffd700, 0 0 75px #ff4500;
        }

        /* Wish Animation */
        .wish-display {
            display: none;
            margin-top: 40px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .wish-text {
            font-size: 2.2rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .sub-text {
            color: #ff8c00;
            font-size: 1.3rem;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Sparkle & Fireworks styles */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 1.2s ease-out forwards;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.08) rotate(2deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sender-name">Anuratna Khare Presents</div>
        <h1 id="main-title">✨ A Special Diwali Surprise ✨</h1>

        <div id="tap-stage" class="diya-section">
            <p class="tap-instruction">🪔 Tap the Diya to light up the celebrations! 🪔</p>
            <div class="diya-container" onclick="lightDiya(this)">
                <div class="flame"></div>
                <div class="diya-bowl"></div>
            </div>
        </div>

        <div id="wish-stage" class="wish-display">
            <p class="wish-text">✨ Happy Diwali ✨<br><span style="color: #fff; font-size: 1.6rem;">from</span><br><span style="color: #ffcc00;">Anuratna Khare</span></p>
            <p class="sub-text">May this festival of lights bring infinite joy, prosperity, and success to your life! 🎆</p>
        </div>
    </div>

    <script>
        function lightDiya(element) {
            if (element.classList.contains('lit')) return;
            
            element.classList.add('lit');
            document.getElementById('main-title').style.display = 'none';
            document.querySelector('.tap-instruction').style.display = 'none';
            
            // Trigger beautiful firework explosion bursts
            for(let i = 0; i < 60; i++) {
                createSparkle();
            }

            // Continuous background sparklers for festive vibe
            setInterval(createSparkle, 200);

            // Smoothly display the customized wish
            setTimeout(() => {
                const wishStage = document.getElementById('wish-stage');
                wishStage.style.display = 'block';
                setTimeout(() => wishStage.style.opacity = '1', 50);
            }, 400);
        }

        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            const size = Math.random() * 8 + 4;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            
            // Vibrant festive firework colors
            const colors = ['#ffd700', '#ff4500', '#ff8c00', '#ffffff', '#00ffff', '#ff00ff', '#00ff00'];
            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
            sparkle.style.boxShadow = `0 0 ${size}px ${sparkle.style.background}`;
            
            // Center the blast coordinates around the diya area
            sparkle.style.left = '50%';
            sparkle.style.top = '45%';
            
            // Randomized trajectory paths for 360 degree explosion effect
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 250 + 50;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance - (Math.random() * 50); // slight upward drag
            
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 1200);
        }
    </script>
</body>
</html>
